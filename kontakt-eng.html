  <meta charset="UTF-8">

  <style>
    :root { --bg: #212d45; --card: #313b4e; --text: #dce4f0; --text-muted: #8898b0; --accent: #a8c0d8; --header-bg: #1d273a; --border: rgba(168,192,216,0.25); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Georgia, 'Times New Roman', serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    header { background: var(--header-bg); border-bottom: 1px solid var(--border); padding: 40px 20px; text-align: center; }
    header h1 { font-size: 2rem; font-weight: normal; color: var(--accent); letter-spacing: 4px; }
    header p { color: var(--text-muted); margin-top: 8px; font-size: 0.85rem; letter-spacing: 3px; }
    .lang-buttons { position: fixed; right: 18px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 16px; z-index: 100; }
    .lang-btn { width: 56px; height: 56px; border-radius: 8px; overflow: hidden; cursor: pointer; border: 2px solid rgba(255,255,255,0.15); box-shadow: 0 3px 12px rgba(0,0,0,0.5); transition: transform 0.2s, border-color 0.2s; text-decoration: none; display: block; position: relative; }
    .lang-btn:hover { transform: scale(1.08); border-color: var(--accent); }
    .flag-de { background: #000; }
    .flag-de svg { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
    .flag-cn { background: #DE2910; position: relative; display: flex; align-items: center; justify-content: center; }
    .flag-cn .stars { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 22px; color: #FFDE00; }
    .flag-cn .small-stars { position: absolute; top: 6px; right: 6px; font-size: 9px; color: #FFDE00; display: flex; flex-direction: column; gap: 1px; align-items: center; }
    .container { padding: 50px 120px 60px 40px; max-width: 760px; margin: 0 auto; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 36px 40px; }
    .card h2 { color: var(--accent); font-size: 1rem; font-weight: normal; letter-spacing: 2px; margin-bottom: 8px; }
    .card p.intro { color: var(--text-muted); font-size: 0.9rem; line-height: 1.8; margin-bottom: 30px; }
    label { display: block; color: var(--text-muted); font-size: 0.85rem; letter-spacing: 1px; margin-bottom: 6px; margin-top: 20px; }
    input, textarea { width: 100%; background: #1d273a; border: 1px solid var(--border); border-radius: 5px; padding: 12px 14px; color: var(--text); font-family: Georgia, serif; font-size: 0.95rem; transition: border-color 0.2s; outline: none; }
    input:focus, textarea:focus { border-color: var(--accent); }
    textarea { resize: vertical; min-height: 140px; }
    .send-btn { margin-top: 28px; display: inline-block; background: transparent; color: var(--accent); border: 1px solid var(--accent); padding: 12px 32px; border-radius: 5px; cursor: pointer; font-size: 0.95rem; font-family: Georgia, serif; letter-spacing: 2px; transition: background 0.2s, color 0.2s; }
    .send-btn:hover { background: var(--accent); color: #1d273a; }
    .back-btn { display: inline-block; margin-top: 28px; color: var(--text-muted); text-decoration: none; font-size: 0.9rem; letter-spacing: 1px; transition: color 0.2s; }
    .back-btn:hover { color: var(--accent); }
  </style>
</head>
<body>
<header>
  <h1>Contact</h1>
  <p>Heribert Lange · Berlin</p>
</header>
<div class="lang-buttons">
  <a href="kontakt.html" class="lang-btn flag-de" title="Deutsch">
    <svg viewBox="0 0 56 56" xmlns="http://www.w3.org/2000/svg">
      <rect x="0" y="0" width="56" height="19" fill="#000000"/>
      <rect x="0" y="19" width="56" height="19" fill="#DD0000"/>
      <rect x="0" y="38" width="56" height="18" fill="#FFCE00"/>
    </svg>
  </a>
  <a href="kontakt-chi.html" class="lang-btn flag-cn" title="中文">
    <div class="stars">★</div>
    <div class="small-stars"><span style="font-size:8px">★</span><span style="font-size:8px">★</span><span style="font-size:8px">★</span><span style="font-size:8px">★</span></div>
  </a>
</div>
<div class="container">
  <div class="card">
    <h2>Get in touch</h2>
    <p class="intro">Questions, feedback or simply hello – I'm happy to hear from you.</p>
    <form action="https://formspree.io/f/xlgzjqkn" method="POST">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" placeholder="Your name" required>
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="your@email.com" required>
      <label for="message">Message</label>
      <textarea id="message" name="message" placeholder="Your message..." required></textarea>
      <input type="text" name="_gotcha" style="display:none" tabindex="-1" autocomplete="off" aria-hidden="true">
      <input type="hidden" name="_language" value="en">
      <button type="submit" class="send-btn">Send</button>
    </form>
    <br>
    <a href="home-eng.html" class="back-btn">⌂ Home</a>
  </div>
</div>

<footer style="border-top: 1px solid var(--border); padding: 20px; text-align: center; margin-top: 32px;">
  <a href="datenschutz-eng.html" style="color: var(--text-muted); text-decoration: none; font-size: 0.78rem; letter-spacing: 2px; text-transform: uppercase;">Privacy Policy</a>
</footer>
</body>
