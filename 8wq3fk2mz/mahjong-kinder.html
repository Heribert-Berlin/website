<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Waldemar-Mahjong · 瓦爾德馬麻將 · Heribert Lange</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/x-icon" href="../favicon.ico">
  <link rel="icon" type="image/png" href="../favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Cinzel:wght@400;600&family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#123026; --text:#eae3cf; --text-muted:#9fb8a6;
      --accent:#e0b352; --header-bg:#0e2620; --border:rgba(224,178,82,0.28);
      --red:#b23b34; --jade:#1f7a5a;
      --tw:54px; --th:73px; --lift:7px;
    }
    *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
    html,body{height:100%;}
    body{
      font-family:'Noto Serif TC','Cormorant Garamond',Georgia,serif;
      background:var(--bg); color:var(--text);
      min-height:100vh; display:flex; flex-direction:column; overflow-x:hidden;
    }
    body::before{
      content:''; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:0.35;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    }

    .topbar{
      position:relative; z-index:10; background:var(--header-bg);
      border-bottom:2px solid var(--red);
      display:flex; align-items:center; justify-content:space-between;
      gap:12px; padding:10px 18px; flex-wrap:wrap;
    }
    .brand{display:flex; align-items:center; gap:12px;}
    .brand .diamond{width:8px; height:8px; background:var(--accent); transform:rotate(45deg);}
    .brand h1{font-family:'Cinzel','Noto Serif TC',serif; font-weight:600; color:var(--accent); font-size:1.4rem; letter-spacing:4px;}
    .controls{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
    .btn{
      font-family:'Cinzel','Noto Serif TC',serif; font-size:0.72rem; letter-spacing:1.2px;
      color:var(--text-muted); background:transparent; border:1px solid var(--border);
      border-radius:20px; padding:7px 13px; cursor:pointer;
      transition:border-color .2s,color .2s,background .2s; white-space:nowrap;
    }
    .btn:hover{border-color:var(--accent); color:var(--accent);}
    .btn.primary{color:var(--header-bg); background:var(--accent); border-color:var(--accent); font-weight:600;}
    .btn.primary:hover{background:#ecc06a;}
    .btn.active{color:var(--accent); border-color:var(--accent); background:rgba(224,178,82,0.14);}
    .btn:disabled{opacity:.4; cursor:default;}
    .lang{display:flex; gap:4px;}
    .lang button{font-family:'Cinzel',serif; font-size:0.7rem; background:transparent; border:1px solid var(--border); color:var(--text-muted); border-radius:6px; padding:5px 9px; cursor:pointer; transition:.2s;}
    .lang button.active{color:var(--accent); border-color:var(--accent);}
    .lang button:hover{color:var(--accent);}

    .subbar{
      position:relative; z-index:9; display:flex; align-items:center; justify-content:center;
      gap:10px 18px; flex-wrap:wrap; padding:9px 16px;
      border-bottom:1px solid var(--border); background:rgba(14,38,32,0.6);
    }
    .group{display:flex; gap:6px; align-items:center;}
    .group .label{font-size:0.75rem; color:var(--text-muted); letter-spacing:1px; margin-right:2px;}
    .stats{display:flex; gap:16px; font-size:0.95rem; color:var(--text-muted);}
    .stats b{color:var(--text); font-variant-numeric:tabular-nums;}
    .reset-best{
      font-size:0.85rem; line-height:1; color:var(--text-muted); background:transparent;
      border:1px solid var(--border); border-radius:50%; width:20px; height:20px;
      cursor:pointer; padding:0; vertical-align:middle; transition:border-color .2s,color .2s;
    }
    .reset-best:hover{border-color:var(--accent); color:var(--accent);}

    .stage{
      position:relative; z-index:1; flex:1;
      background:radial-gradient(circle at 50% 38%, #1d5742 0%, #143a2c 58%, #0e2a20 100%);
      display:flex; align-items:center; justify-content:center; padding:14px 8px;
      overflow:auto;
    }
    .board{position:relative;}

    .tile{
      position:absolute; width:var(--tw); height:var(--th);
      border-radius:calc(var(--tw)*0.14);
      background:linear-gradient(150deg,#fcf8ec 0%,#efe6cf 60%,#e3d8ba 100%);
      border:1px solid #b6a980;
      box-shadow:inset 0 1px 0 #fff, inset -2px -3px 4px rgba(120,100,60,0.25), 2px 4px 5px rgba(0,0,0,0.45);
      display:flex; align-items:center; justify-content:center;
      cursor:pointer; user-select:none;
      transition:transform .12s, box-shadow .12s, opacity .28s, filter .15s;
    }
    .tile .g{width:86%; height:86%; object-fit:contain; pointer-events:none;
      filter:drop-shadow(0 1px 1px rgba(0,0,0,0.25));}
    .tile.blk{filter:brightness(0.72) saturate(0.85);}
    .tile.free:hover{transform:translateY(-1px);}
    .tile.sel{transform:translateY(-3px); box-shadow:0 0 0 3px var(--accent), 2px 5px 9px rgba(0,0,0,0.55); background:linear-gradient(150deg,#fff8d9,#f1e3ad);}
    .tile.match{box-shadow:0 0 0 3px #6fd08c, 2px 4px 6px rgba(0,0,0,0.45);}
    .tile.hintp{animation:hintpulse .6s ease-in-out 3;}
    @keyframes hintpulse{50%{box-shadow:0 0 0 4px var(--red), 2px 4px 6px rgba(0,0,0,0.45);}}
    .tile.gone{opacity:0; transform:scale(0.35) rotate(8deg); pointer-events:none;}
    .tile.shake{animation:tshake .3s;}
    @keyframes tshake{25%{transform:translateX(-3px);}75%{transform:translateX(3px);}}

    .toast{
      position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
      z-index:6000; background:var(--header-bg); border:1px solid var(--accent);
      color:var(--text); padding:10px 20px; border-radius:22px; font-size:0.95rem;
      box-shadow:0 8px 24px rgba(0,0,0,0.5); opacity:0; transition:opacity .3s; pointer-events:none;
    }
    .toast.show{opacity:1;}

    footer{position:relative; z-index:1; text-align:center; padding:9px; font-size:0.8rem; color:var(--text-muted); opacity:0.75; letter-spacing:1px;}
    footer a{color:var(--text-muted); text-decoration:underline; text-underline-offset:3px;}

    .overlay{position:fixed; inset:0; z-index:7000; display:none; align-items:center; justify-content:center; flex-direction:column; gap:14px; background:rgba(8,18,14,0.55);}
    .overlay.show{display:flex;}
    .spinner{width:46px; height:46px; border:4px solid rgba(224,178,82,0.25); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .overlay p{color:var(--text); letter-spacing:1px;}

    .winbox{position:fixed; inset:0; z-index:7100; display:none; align-items:center; justify-content:center; flex-direction:column; gap:16px; background:rgba(8,18,14,0.5); text-align:center; padding:20px;}
    .winbox.show{display:flex;}
    .winbox .drag{font-size:3.4rem; animation:bob 1.7s ease-in-out infinite;}
    @keyframes bob{50%{transform:translateY(-9px);}}
    .winbox h2{font-family:'Cinzel','Noto Serif TC',serif; color:var(--accent); font-size:2.6rem; letter-spacing:6px; text-shadow:0 3px 18px rgba(0,0,0,0.7);}
    .winbox p{color:var(--text); font-size:1.15rem;}

    @media(max-width:560px){
      .brand h1{font-size:1.1rem; letter-spacing:2px;}
      .btn{padding:6px 9px; font-size:0.64rem;}
      .stats{gap:10px; font-size:0.82rem;}
    }

    /* ---- Anleitung / Kinderschutz ---- */
    .scrim{position:fixed; inset:0; display:none; align-items:center; justify-content:center; padding:18px; background:rgba(8,18,14,0.84);}
    .scrim.show{display:flex;}
    #guideModal{z-index:8000;} #medModal{z-index:8200;} #gateModal{z-index:8400;} #hardModal{z-index:8600;}
    .sheet{background:var(--header-bg); border:2px solid var(--accent); border-radius:14px; max-width:520px; width:100%; max-height:88vh; overflow:auto; padding:22px; box-shadow:0 18px 60px rgba(0,0,0,.6);}
    .sheet h2{font-family:'Cinzel','Noto Serif TC',serif; color:var(--accent); font-size:1.5rem; letter-spacing:2px; margin-bottom:14px; text-align:center;}
    .sheet p{color:var(--text); line-height:1.5; margin-bottom:10px;}
    .sheet p.center{text-align:center;}
    .sheet ol{color:var(--text); line-height:1.55; padding-left:1.4em; display:flex; flex-direction:column; gap:7px;}
    .sheet ol li{padding-left:4px;}
    .sheet-actions{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:18px;}
    .sheet .btn{font-size:0.8rem; padding:9px 16px;}
    .parent{margin-top:20px; padding-top:16px; border-top:1px solid var(--border);}
    .parent-title{font-family:'Cinzel',serif; color:var(--text-muted); font-size:0.75rem; letter-spacing:2px; text-transform:uppercase; margin-bottom:8px;}
    .parent-desc{color:var(--text-muted); font-size:0.85rem; line-height:1.45; margin-bottom:12px;}
    .parent-time{color:var(--text-muted); font-size:0.8rem; margin-top:12px;}
    .gateQ{font-family:'Cinzel',serif; color:var(--accent); font-size:2rem; text-align:center; letter-spacing:3px; margin:6px 0 14px;}
    .gateInput{width:100%; font-size:1.4rem; text-align:center; padding:10px; border-radius:8px; border:1px solid var(--border); background:rgba(0,0,0,.25); color:var(--text); font-family:'Cinzel',serif; -moz-appearance:textfield;}
    .gateInput:focus{outline:none; border-color:var(--accent);}
    .gateInput::-webkit-outer-spin-button,.gateInput::-webkit-inner-spin-button{-webkit-appearance:none; margin:0;}
    .gateErr{color:var(--red); text-align:center; font-size:0.85rem; margin-top:8px; visibility:hidden;}
    #hardCount{font-family:'Cinzel',serif; color:var(--accent); font-size:3rem; letter-spacing:4px; text-align:center; margin:6px 0 4px;}
    .softbar{position:fixed; left:50%; transform:translateX(-50%); bottom:14px; z-index:6500; display:none; align-items:center; gap:14px; background:var(--header-bg); border:1px solid var(--accent); border-radius:30px; padding:10px 16px 10px 18px; box-shadow:0 8px 30px rgba(0,0,0,.5); max-width:92vw;}
    .softbar.show{display:flex;}
    .softbar span{color:var(--text); font-size:0.9rem;}
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand"><span class="diamond"></span><h1 id="t-title">Waldemar-Mahjong</h1></div>
    <div class="controls">
      <button class="btn primary" id="btnNew">Neues Spiel</button>
      <button class="btn" id="btnUndo">Zurück</button>
      <button class="btn" id="btnHint">Tipp</button>
      <button class="btn" id="btnShuffle">Mischen</button>
      <button class="btn" id="btnSound">🔊 Ton</button>
      <button class="btn" id="btnGuide">Anleitung</button>
      <span class="lang">
        <button data-lang="de" class="active">DE</button>
        <button data-lang="en">EN</button>
        <button data-lang="zh">中文</button>
      </span>
    </div>
  </div>

  <div class="subbar">
    <div class="group" id="layoutGroup"><span class="label" id="t-layout">Stufe</span></div>
    <div class="stats">
      <span><span id="t-left">Steine</span>: <b id="left">0</b></span>
      <span><span id="t-time">Zeit</span>: <b id="time">0:00</b></span>
      <span><span id="t-best">Bestzeit</span>: <b id="best">–</b> <button class="reset-best" id="btnResetBest" title="Bestzeit zurücksetzen">↺</button></span>
    </div>
  </div>

  <div class="stage" id="stage"><div class="board" id="board"></div></div>

  <footer><a href="spiele.html" id="t-platform">⌂ Spielezimmer</a> &nbsp;·&nbsp; <a href="/" id="t-back">← Startseite</a> &nbsp;·&nbsp; © 2026 Heribert Lange</footer>

  <div class="toast" id="toast"></div>
  <div class="overlay" id="overlay"><div class="spinner"></div><p id="t-gen">Mische die Steine …</p></div>
  <div class="winbox" id="winbox">
    <div class="drag">🦉</div>
    <h2 id="t-win">Geschafft!</h2>
    <p id="t-winsub">Alle Steine entfernt!</p>
    <button class="btn primary" id="btnWinNew">Neues Spiel</button>
  </div>

  <!-- Anleitung -->
  <div class="scrim" id="guideModal">
    <div class="sheet">
      <h2 id="g-title">Anleitung</h2>
      <ol id="g-list"></ol>
      <div class="sheet-actions">
        <button class="btn primary" id="btnSpeak">▶ Vorlesen</button>
        <button class="btn" id="btnGuideClose">Schließen</button>
      </div>
      <div class="parent">
        <div class="parent-title" id="g-parent">Für Erwachsene</div>
        <div class="parent-desc" id="g-guarddesc"></div>
        <button class="btn" id="btnGuard">Kinderschutz: AN</button>
        <div class="parent-time" id="g-elapsed"></div>
      </div>
    </div>
  </div>

  <!-- Mittel-Pause -->
  <div class="scrim" id="medModal">
    <div class="sheet">
      <h2 id="m-title">Pause!</h2>
      <p id="m-msg" class="center"></p>
      <div class="sheet-actions">
        <button class="btn primary" id="btnMedContinue"></button>
        <button class="btn" id="btnMedDisable"></button>
      </div>
    </div>
  </div>

  <!-- Eltern-Tor -->
  <div class="scrim" id="gateModal">
    <div class="sheet">
      <h2 id="gate-title">Frage für Erwachsene</h2>
      <div class="gateQ" id="gateQ"></div>
      <input class="gateInput" id="gateInput" type="number" inputmode="numeric">
      <div class="gateErr" id="gateErr"></div>
      <div class="sheet-actions">
        <button class="btn primary" id="btnGateOk">OK</button>
        <button class="btn" id="btnGateCancel">Zurück</button>
      </div>
    </div>
  </div>

  <!-- Harte Sperre -->
  <div class="scrim" id="hardModal">
    <div class="sheet">
      <h2 id="h-title">Lange genug gespielt!</h2>
      <p id="h-msg" class="center"></p>
      <p id="h-count-label" class="center" style="color:var(--text-muted); font-size:.85rem; margin-bottom:0;"></p>
      <div id="hardCount">30:00</div>
    </div>
  </div>

  <!-- Sanftes Banner -->
  <div class="softbar" id="softBar">
    <span id="soft-msg"></span>
    <button class="btn primary" id="btnSoftOk">Alles klar</button>
  </div>

const TIERE=[...new Set(Object.keys(IMG).map(k=>k.split("_")[0]))];
/* Stufe 0 (40 Steine): pro Tier nur EINE Sorte, sonst liegen echtes und gemaltes Reh
   als zwei verschiedene Paare nebeneinander und Kinder greifen dauernd daneben.
   Stufe 1 (80 Steine): alle 40 Bilder, jedes genau einmal als Paar. */
function symbolsFor(li){
  return li===0 ? TIERE.map(t=>t+(Math.random()<0.5?"_echt":"_cartoon")) : Object.keys(IMG);
}

/* ============================ Layouts (Positionen x,y,z in Halb-Stein-Einheiten) ============================ */
function rectLayer(z,x0,y0,cols,rows){ const a=[]; for(let j=0;j<rows;j++) for(let i=0;i<cols;i++) a.push({x:x0+2*i,y:y0+2*j,z}); return a; }
function buildLayouts(){
  return [
    // Einfach: 40 Steine, 2 Lagen, jedes der 20 Tiere einmal als Paar
    rectLayer(0,0,0,8,4).concat(rectLayer(1,4,2,4,2)),
    // Doppelt: 80 Steine, 2 Lagen, alle 40 Bilder als Paar
    rectLayer(0,0,0,10,6).concat(rectLayer(1,6,1,4,5))
  ];
}
const LAYOUTS=buildLayouts();

/* ============================ Zustand ============================ */
let layoutIdx=0, themeIdx=0;
let positions=[], assign=[], present=null, tiles=[];
let selIdx=-1, undoStack=[], seconds=0, timer=null, started=false, solved=false;
let bestTimes={}; try{ bestTimes=JSON.parse(localStorage.getItem("mjk_best")||"{}"); }catch(e){ bestTimes={}; }
function fmtTime(s){ const m=s/60|0,sec=s%60; return m+":"+String(sec).padStart(2,"0"); }
function updateBestDisplay(){
  const b=bestTimes[layoutIdx];
  document.getElementById("best").textContent = (b==null) ? "–" : fmtTime(b);
}
function resetBest(){
  if(!confirm(I18N[lang].resetBestConfirm)) return;
  delete bestTimes[layoutIdx];
  try{ localStorage.setItem("mjk_best",JSON.stringify(bestTimes)); }catch(e){}
  updateBestDisplay();
}

function shuffleArr(a){ for(let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* ---- Frei-Erkennung (nutzt ein Set vorhandener Indizes) ---- */
function isFreeIn(setPresent,idx){
  const t=positions[idx];
  for(const j of setPresent){ if(j===idx) continue; const u=positions[j];
    if(u.z===t.z+1 && Math.abs(u.x-t.x)<=1 && Math.abs(u.y-t.y)<=1) return false; }
  let left=false,right=false;
  for(const j of setPresent){ if(j===idx) continue; const u=positions[j];
    if(u.z===t.z && Math.abs(u.y-t.y)<=1){ if(u.x===t.x-2) left=true; else if(u.x===t.x+2) right=true; } }
  return !(left&&right);
}

/* ---- Ein Generierungsversuch: liefert {res, ok} ; ok=true ⇒ beweisbar lösbar ---- */
function generateOnce(posList,symbols){
  const M=posList.length;
  const setP=new Set(); for(let i=0;i<M;i++) setP.add(i);
  const pairs=M/2, bag=[];
  const pool=shuffleArr(symbols.slice());   // gemischt, damit bei mehr Bildern als Paaren nicht immer dieselben kommen
  for(let p=0;p<pairs;p++) bag.push(pool[p%pool.length]);
  shuffleArr(bag);
  const res=new Array(M); let bi=0, ok=true;
  const free=(set,idx)=>{ const t=posList[idx];
    for(const j of set){ if(j===idx) continue; const u=posList[j]; if(u.z===t.z+1 && Math.abs(u.x-t.x)<=1 && Math.abs(u.y-t.y)<=1) return false; }
    let l=false,r=false; for(const j of set){ if(j===idx) continue; const u=posList[j]; if(u.z===t.z && Math.abs(u.y-t.y)<=1){ if(u.x===t.x-2)l=true; else if(u.x===t.x+2)r=true; } } return !(l&&r); };
  while(setP.size>=2){
    const fr=[]; for(const idx of setP) if(free(setP,idx)) fr.push(idx);
    let a,b;
    if(fr.length>=2){ a=fr[Math.random()*fr.length|0]; do{ b=fr[Math.random()*fr.length|0]; }while(b===a); }
    else { ok=false; const arr=[...setP]; a=arr[0]; b=arr[1]; }   // Sackgasse → Versuch verwerfen
    const s=bag[bi++]; res[a]=s; res[b]=s; setP.delete(a); setP.delete(b);
  }
  return {res,ok};
}
/* ---- Garantiert lösbare Symbol-Zuordnung (neu würfeln bis ohne Sackgasse) ---- */
function generateSolvable(posList,symbols){
  let last=null;
  for(let attempt=0; attempt<120; attempt++){
    const g=generateOnce(posList,symbols);
    last=g.res;
    if(g.ok) return g.res;
  }
  return last;
}

/* ============================ Neues Spiel ============================ */
function startNew(li,ti){
  layoutIdx=li; themeIdx=ti;
  showOverlay();
  setTimeout(()=>{
    positions=LAYOUTS[layoutIdx].map(p=>({x:p.x,y:p.y,z:p.z}));
    assign=generateSolvable(positions,symbolsFor(layoutIdx));
    present=new Set(); for(let i=0;i<positions.length;i++) present.add(i);
    selIdx=-1; undoStack=[]; seconds=0; started=false; solved=false;
    stopTimer(); updateClock();
    buildTiles(); layoutTiles(); refresh();
    requestAnimationFrame(layoutTiles);
    hideOverlay(); hideWin();
    save(); syncToolbar();
  },30);
}

/* ============================ Rendering ============================ */
const stage=document.getElementById("stage");
const board=document.getElementById("board");

function extents(){
  let mx=0,my=0,mz=0;
  for(const p of positions){ if(p.x>mx)mx=p.x; if(p.y>my)my=p.y; if(p.z>mz)mz=p.z; }
  return {mx:mx+2,my:my+2,mz};
}
function computeTileSize(){
  const {mx,my,mz}=extents();
  const availW=stage.clientWidth-24, availH=stage.clientHeight-24;
  // Breite ≈ tw*(mx/2) + mz*lift ; Höhe ≈ th*(my/2) + mz*lift ; th=tw*1.35 ; lift=tw*0.13
  const wPer=mx/2 + mz*0.13;
  const hPer=1.35*my/2 + mz*0.13;
  let tw=Math.min(availW/wPer, availH/hPer);
  /* Tierbilder brauchen mehr Flaeche als Zeichen. Untergrenze 40px: auf dem Handy
     scrollt die Buehne dann lieber ein Stueck, als die Tiere unkenntlich zu schrumpfen. */
  tw=Math.max(40,Math.min(tw,100));
  return tw;
}
function layoutTiles(){
  const tw=computeTileSize(), th=tw*1.35, lift=tw*0.13;
  document.documentElement.style.setProperty("--tw",tw+"px");
  document.documentElement.style.setProperty("--th",th+"px");
  document.documentElement.style.setProperty("--lift",lift+"px");
  const {mx,my,mz}=extents();
  board.style.width=(mx/2*tw + mz*lift)+"px";
  board.style.height=(my/2*th + mz*lift)+"px";
  for(let i=0;i<positions.length;i++){
    const p=positions[i], el=tiles[i];
    const left=p.x/2*tw + p.z*lift;
    const top=p.y/2*th - p.z*lift + mz*lift;
    el.style.left=left+"px"; el.style.top=top+"px";
    el.style.zIndex=(p.z*1000 + p.y*10 + p.x);
  }
}
function buildTiles(){
  board.innerHTML=""; tiles=[];
  for(let i=0;i<positions.length;i++){
    const el=document.createElement("div");
    el.className="tile";
    el.dataset.idx=i;
    el.innerHTML=`<img class="g" alt="" draggable="false" src="${IMG[assign[i]]}">`;
    board.appendChild(el); tiles.push(el);
  }
}
function refresh(){
  for(let i=0;i<positions.length;i++){
    const el=tiles[i];
    if(!present.has(i)){ el.classList.add("gone"); continue; }
    el.classList.remove("gone");
    const free=isFreeIn(present,i);
    el.classList.toggle("blk",!free);
    el.classList.toggle("free",free);
    el.classList.toggle("sel",i===selIdx);
    el.classList.remove("match");
  }
  // passende freie Steine markieren, wenn einer gewählt ist
  if(selIdx>=0){
    const sym=assign[selIdx];
    for(let i=0;i<positions.length;i++){
      if(i!==selIdx && present.has(i) && assign[i]===sym && isFreeIn(present,i)) tiles[i].classList.add("match");
    }
  }
  document.getElementById("left").textContent=present.size;
}

/* ============================ Eingabe ============================ */
board.addEventListener("pointerdown",e=>{
  const el=e.target.closest(".tile"); if(!el) return;
  ensureAudio();
  const idx=+el.dataset.idx;
  if(!present.has(idx)||solved) return;
  if(!isFreeIn(present,idx)){ shake(el); sfx("blocked"); return; }
  ensureTimer();
  if(selIdx===idx){ selIdx=-1; refresh(); return; }
  if(selIdx<0){ selIdx=idx; sfx("select"); refresh(); return; }
  if(assign[idx]===assign[selIdx]){
    // Paar entfernen
    const a=selIdx,b=idx;
    undoStack.push([a,b]); if(undoStack.length>400) undoStack.shift();
    present.delete(a); present.delete(b); selIdx=-1;
    sfx("match");
    refresh(); save();
    if(present.size===0){ win(); }
    else if(!hasMove()){ toast(I18N[lang].stuck); sfx("stuck"); setTimeout(()=>shuffleRemaining(true),900); }
  } else {
    selIdx=idx; sfx("select"); refresh(); // Auswahl wechseln
  }
});

function ensureTimer(){ if(!started){ started=true; startTimer(); } }
function shake(el){ el.classList.add("shake"); setTimeout(()=>el.classList.remove("shake"),300); }

/* ============================ Hilfen ============================ */
function freeList(){ const f=[]; for(const i of present) if(isFreeIn(present,i)) f.push(i); return f; }
function findPair(){
  const f=freeList();
  for(let a=0;a<f.length;a++) for(let b=a+1;b<f.length;b++) if(assign[f[a]]===assign[f[b]]) return [f[a],f[b]];
  return null;
}
function hasMove(){ return findPair()!==null; }
function hint(){
  if(solved) return;
  const p=findPair();
  if(!p){ toast(I18N[lang].nomatch); return; }
  ensureTimer();
  sfx("hint");
  p.forEach(i=>{ tiles[i].classList.add("hintp"); setTimeout(()=>tiles[i].classList.remove("hintp"),1900); });
}
function undo(){
  if(!undoStack.length) return;
  const [a,b]=undoStack.pop();
  present.add(a); present.add(b); selIdx=-1; solved=false;
  refresh(); save();
}
/* auto=true: das Spiel mischt selbst, weil kein Zug mehr moeglich ist (Meldung kam schon) */
function shuffleRemaining(auto){
  if(solved) return;
  const idxs=[...present];
  if(idxs.length<2) return;
  const posList=idxs.map(i=>positions[i]);
  const newSyms=generateSolvable(posList,[...new Set(assign)]);   // dieselben Bilder wie im laufenden Spiel
  idxs.forEach((i,k)=>{ assign[i]=newSyms[k]; tiles[i].querySelector(".g").src=IMG[newSyms[k]]; });
  selIdx=-1; undoStack=[]; refresh(); save();
  sfx("shuffle");
  if(!auto) toast(I18N[lang].shuffle+" ✓");
}

/* ============================ Gewinn ============================ */
function win(){
  solved=true; stopTimer();
  sfx("win");
  if(bestTimes[layoutIdx]==null || seconds<bestTimes[layoutIdx]){
    bestTimes[layoutIdx]=seconds;
    try{ localStorage.setItem("mjk_best",JSON.stringify(bestTimes)); }catch(e){}
  }
  updateBestDisplay();
  setTimeout(()=>document.getElementById("winbox").classList.add("show"),350);
  try{ localStorage.removeItem("mjk_state"); }catch(e){}
}

/* ============================ Persistenz ============================ */
function save(){
  if(solved) return;
  try{ localStorage.setItem("mjk_state",JSON.stringify({
    layoutIdx,themeIdx,assign,present:[...present],undoStack,seconds,started
  })); }catch(e){}
}
function load(){
  try{
    const o=JSON.parse(localStorage.getItem("mjk_state")||"null");
    if(!o||!o.assign) return false;
    layoutIdx=o.layoutIdx; themeIdx=o.themeIdx;
    positions=LAYOUTS[layoutIdx].map(p=>({x:p.x,y:p.y,z:p.z}));
    assign=o.assign; present=new Set(o.present); undoStack=o.undoStack||[];
    seconds=o.seconds||0; started=o.started; selIdx=-1; solved=false;
    buildTiles(); layoutTiles(); refresh();
    requestAnimationFrame(layoutTiles);
    /* alter Spielstand kann festgefahren sein, dann gleich mischen */
    if(present.size>1 && !hasMove()){ toast(I18N[lang].stuck); setTimeout(()=>shuffleRemaining(true),900); }
    return true;
  }catch(e){ return false; }
}

/* ============================ Uhr / Toast / Overlays ============================ */
function startTimer(){ stopTimer(); timer=setInterval(()=>{ seconds++; updateClock(); if(seconds%5===0) save(); },1000); }
function stopTimer(){ if(timer){ clearInterval(timer); timer=null; } }
function updateClock(){ const m=seconds/60|0,s=seconds%60; document.getElementById("time").textContent=m+":"+String(s).padStart(2,"0"); }
let toastT=null;
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2200); }
function showOverlay(){ document.getElementById("t-gen").textContent=I18N[lang].gen; document.getElementById("overlay").classList.add("show"); }
function hideOverlay(){ document.getElementById("overlay").classList.remove("show"); }
function hideWin(){ document.getElementById("winbox").classList.remove("show"); }

/* ============================ Ton (chinesisch angehaucht) ============================ */
let actx=null, soundOn=(localStorage.getItem("mjk_sound")!=="0");
function ensureAudio(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(actx&&actx.state==="suspended") actx.resume(); }
function tone(freq,start,dur,vol,type){
  if(!actx) return;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type=type||"sine"; o.frequency.value=freq;
  const t0=actx.currentTime+start;
  g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(vol,t0+0.015); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0+dur+0.03);
}
function noiseBurst(dur,vol,freq){
  if(!actx) return;
  const n=Math.max(1,Math.floor(actx.sampleRate*dur)), buf=actx.createBuffer(1,n,actx.sampleRate), data=buf.getChannelData(0);
  for(let i=0;i<n;i++) data[i]=(Math.random()*2-1)*(1-i/n);
  const src=actx.createBufferSource(); src.buffer=buf;
  const f=actx.createBiquadFilter(); f.type="bandpass"; f.frequency.value=freq||1500; f.Q.value=0.5;
  const g=actx.createGain(); const t0=actx.currentTime;
  g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  src.connect(f); f.connect(g); g.connect(actx.destination); src.start(t0); src.stop(t0+dur+0.02);
}
const PENTA=[523.25,587.33,659.25,783.99,880.00,1046.50];   // C-Dur-Pentatonik (chinesischer Klang)
function gong(){
  if(!actx) return; const t0=actx.currentTime;
  [[123.47,0.13],[185,0.08],[277,0.06],[370,0.04],[146.83,0.07]].forEach(([f,v])=>{
    const o=actx.createOscillator(),g=actx.createGain(); o.type="sine"; o.frequency.value=f;
    g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(v,t0+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t0+1.9);
    o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0+2.0);
  });
  noiseBurst(0.10,0.05,900);
}
function sfx(kind){
  if(!soundOn) return; ensureAudio(); if(!actx) return;
  if(kind==="select"){ tone(PENTA[2],0,0.08,0.05,"sine"); }
  else if(kind==="match"){ tone(PENTA[3],0,0.16,0.09,"sine"); tone(PENTA[5],0.07,0.22,0.07,"sine"); }
  else if(kind==="blocked"){ tone(150,0,0.13,0.08,"triangle"); }
  else if(kind==="shuffle"){ PENTA.slice(0,5).forEach((f,i)=>tone(f,i*0.05,0.14,0.06,"sine")); }
  else if(kind==="hint"){ tone(PENTA[4],0,0.12,0.06,"sine"); tone(PENTA[2],0.10,0.14,0.05,"sine"); }
  else if(kind==="stuck"){ tone(PENTA[2],0,0.16,0.07,"sine"); tone(PENTA[0],0.13,0.22,0.07,"sine"); }
  else if(kind==="win"){ gong(); [0,1,2,3,4,5].forEach(i=>tone(PENTA[i],0.18+i*0.10,0.5,0.08,"sine")); }
}
function toggleSound(){
  soundOn=!soundOn; localStorage.setItem("mjk_sound",soundOn?"1":"0");
  const b=document.getElementById("btnSound");
  b.textContent=(soundOn?"🔊 ":"🔈 ")+I18N[lang].sound;
  b.classList.toggle("active",soundOn);
  if(soundOn){ ensureAudio(); sfx("match"); }
}

/* ============================ Kinderschutz / Zeitbremse (wie Sudoku) ============================ */
const SDK={OPEN:"mjk_open_ts",SEEN:"mjk_last_seen",LOCK:"mjk_locked_until",MED:"mjk_med_passed",SOFT:"mjk_soft_done",GUARD:"mjk_guard"};
const MIN=60000, T_SOFT=60, T_MED=70, T_HARD=180, T_BREAK=30, GAP=30;   // Minuten
let guardOn=localStorage.getItem(SDK.GUARD)!=="0";                       // Standard: an
let openTs=Date.now(), guardTimer=null, hardTimer=null;
function sameDay(a,b){ const x=new Date(a),y=new Date(b); return x.getFullYear()===y.getFullYear()&&x.getMonth()===y.getMonth()&&x.getDate()===y.getDate(); }
function startSession(now){ openTs=now; localStorage.setItem(SDK.OPEN,now); localStorage.removeItem(SDK.MED); localStorage.removeItem(SDK.SOFT); localStorage.removeItem(SDK.LOCK); }
function updateElapsed(){ const el=document.getElementById("g-elapsed"); if(!el) return; if(!guardOn){ el.textContent=""; return; } el.textContent=I18N[lang].elapsedLbl+" "+Math.floor((Date.now()-openTs)/MIN)+" min"; }
function updateGuardBtn(){ const b=document.getElementById("btnGuard"); if(!b) return; b.textContent=guardOn?I18N[lang].guardOnLbl:I18N[lang].guardOffLbl; b.classList.toggle("active",guardOn); }
function initGuard(){
  if(!guardOn) return;
  const now=Date.now();
  const lock=+localStorage.getItem(SDK.LOCK)||0;
  if(lock&&now<lock){ openTs=+localStorage.getItem(SDK.OPEN)||now; localStorage.setItem(SDK.SEEN,now); showHard(lock); startGuardLoop(); return; }
  const lastSeen=+localStorage.getItem(SDK.SEEN)||0, savedOpen=+localStorage.getItem(SDK.OPEN)||0;
  if(lock||!savedOpen||(now-lastSeen)>GAP*MIN||!sameDay(savedOpen,now)) startSession(now);
  else openTs=savedOpen;
  localStorage.setItem(SDK.SEEN,now);
  startGuardLoop();
}
function startGuardLoop(){ guardTick(); if(!guardTimer) guardTimer=setInterval(guardTick,15000); }
function guardTick(){
  if(!guardOn) return;
  const now=Date.now();
  localStorage.setItem(SDK.SEEN,now);
  const lock=+localStorage.getItem(SDK.LOCK)||0;
  if(lock){ if(now<lock){ showHard(lock); return; } startSession(now); document.getElementById("hardModal").classList.remove("show"); if(hardTimer){ clearInterval(hardTimer); hardTimer=null; } }
  const mins=(now-openTs)/MIN;
  if(mins>=T_HARD){ triggerHard(now); return; }
  if(mins>=T_MED&&localStorage.getItem(SDK.MED)!=="1"){ showMedium(); return; }
  if(mins>=T_SOFT&&localStorage.getItem(SDK.SOFT)!=="1"){ showSoft(); }
}
function showSoft(){ document.getElementById("softBar").classList.add("show"); }
function hideSoft(){ document.getElementById("softBar").classList.remove("show"); }
function showMedium(){ stopTimer(); hideSoft(); document.getElementById("medModal").classList.add("show"); }
function hideMedium(){ document.getElementById("medModal").classList.remove("show"); }
function triggerHard(now){ const until=now+T_BREAK*MIN; localStorage.setItem(SDK.LOCK,until); showHard(until); }
function showHard(until){
  stopTimer(); hideSoft(); hideMedium();
  document.getElementById("gateModal").classList.remove("show");
  document.getElementById("hardModal").classList.add("show");
  updateHard(until);
  if(!hardTimer) hardTimer=setInterval(()=>updateHard(until),1000);
}
function updateHard(until){
  const rem=Math.max(0,Math.ceil((until-Date.now())/1000));
  if(rem<=0){ clearInterval(hardTimer); hardTimer=null; document.getElementById("hardModal").classList.remove("show"); startSession(Date.now()); return; }
  document.getElementById("hardCount").textContent=Math.floor(rem/60)+":"+String(rem%60).padStart(2,"0");
}
function disableGuard(){
  guardOn=false; localStorage.setItem(SDK.GUARD,"0");
  localStorage.removeItem(SDK.LOCK); localStorage.removeItem(SDK.MED); localStorage.removeItem(SDK.SOFT);
  if(guardTimer){ clearInterval(guardTimer); guardTimer=null; }
  if(hardTimer){ clearInterval(hardTimer); hardTimer=null; }
  document.getElementById("hardModal").classList.remove("show"); hideMedium(); hideSoft();
  updateGuardBtn(); updateElapsed();
  if(started&&!solved) startTimer();
}
function enableGuard(){ guardOn=true; localStorage.setItem(SDK.GUARD,"1"); startSession(Date.now()); updateGuardBtn(); updateElapsed(); startGuardLoop(); }
let gateAnswer=0, gateCb=null;
function askGate(hard,cb){
  let a,b,ans,q;
  if(hard){ a=6+(Math.random()*7|0); b=6+(Math.random()*7|0); ans=a*b; q=a+" × "+b+" = ?"; }
  else{ a=2+(Math.random()*8|0); b=2+(Math.random()*8|0); ans=a+b; q=a+" + "+b+" = ?"; }
  gateAnswer=ans; gateCb=cb;
  document.getElementById("gateQ").textContent=q;
  const inp=document.getElementById("gateInput"); inp.value="";
  document.getElementById("gateErr").style.visibility="hidden";
  document.getElementById("gateModal").classList.add("show");
  setTimeout(()=>inp.focus(),60);
}
function gateSubmit(){
  const inp=document.getElementById("gateInput");
  if(parseInt(inp.value,10)===gateAnswer){ document.getElementById("gateModal").classList.remove("show"); const cb=gateCb; gateCb=null; if(cb) cb(); }
  else{ document.getElementById("gateErr").style.visibility="visible"; inp.value=""; inp.focus(); }
}
function gateCancel(){ document.getElementById("gateModal").classList.remove("show"); gateCb=null; }

/* ============================ Anleitung / Vorlesen ============================ */
/* Simons Aufnahmen der Anleitung (16.08.2026). Fehlt eine Datei, blendet sich der Knopf aus. */
const NARR={de:"Waldemar-Mahjong%20DEU.mp3", en:"Waldemar-Mahjong%20ENG.mp3", zh:"Waldemar-Mahjong%20CHI.mp3"};
let narr=null, playing=false;
function getNarr(){
  if(!narr){
    narr=new Audio();
    narr.addEventListener("ended",()=>{ playing=false; updateSpeakBtn(); });
    narr.addEventListener("pause",()=>{ playing=false; updateSpeakBtn(); });
    narr.addEventListener("error",()=>{ playing=false; const b=document.getElementById("btnSpeak"); if(b) b.style.display="none"; });
  }
  return narr;
}
function updateSpeakBtn(){
  const b=document.getElementById("btnSpeak"); if(!b) return;
  b.style.display=NARR[lang]?"":"none";
  b.textContent=playing?I18N[lang].stopSpeak:I18N[lang].speak;
}
function stopNarration(){ if(narr){ narr.pause(); try{ narr.currentTime=0; }catch(e){} } playing=false; updateSpeakBtn(); }
function speakGuide(){
  const a=getNarr();
  if(playing){ stopNarration(); return; }
  a.src=NARR[lang]; try{ a.currentTime=0; }catch(e){}
  const p=a.play();
  playing=true; updateSpeakBtn();
  if(p&&p.catch) p.catch(()=>{ playing=false; updateSpeakBtn(); });
}

function applyGuardLang(){
  const t=I18N[lang];
  document.getElementById("g-title").textContent=t.guideTitle;
  const ol=document.getElementById("g-list"); ol.innerHTML=""; t.guide.forEach(s=>{ const li=document.createElement("li"); li.textContent=s; ol.appendChild(li); });
  document.getElementById("btnGuideClose").textContent=t.close;
  document.getElementById("g-parent").textContent=t.parentTitle;
  document.getElementById("g-guarddesc").textContent=t.guardDesc;
  document.getElementById("m-title").textContent=t.medTitle;
  document.getElementById("m-msg").textContent=t.medMsg;
  document.getElementById("btnMedContinue").textContent=t.medContinue;
  document.getElementById("btnMedDisable").textContent=t.medDisable;
  document.getElementById("gate-title").textContent=t.gateTitle;
  document.getElementById("gateErr").textContent=t.gateWrong;
  document.getElementById("btnGateOk").textContent=t.gateOk;
  document.getElementById("btnGateCancel").textContent=t.gateCancel;
  document.getElementById("h-title").textContent=t.hardTitle;
  document.getElementById("h-msg").textContent=t.hardMsg;
  document.getElementById("h-count-label").textContent=t.hardCountLbl;
  document.getElementById("soft-msg").textContent=t.softMsg;
  document.getElementById("btnSoftOk").textContent=t.softOk;
  updateGuardBtn(); updateElapsed(); updateSpeakBtn();
}
function openGuide(){ updateGuardBtn(); updateElapsed(); updateSpeakBtn(); document.getElementById("guideModal").classList.add("show"); }
function closeGuide(){ stopNarration(); document.getElementById("guideModal").classList.remove("show"); }

/* ============================ Sprache / Auswahlleisten ============================ */
function buildSelectors(){
  const lg=document.getElementById("layoutGroup");
  [...lg.querySelectorAll("button")].forEach(b=>b.remove());
  I18N[lang].layouts.forEach((name,idx)=>{
    const b=document.createElement("button"); b.className="btn"; b.dataset.layout=idx; b.textContent=name;
    b.addEventListener("click",()=>startNew(idx,themeIdx)); lg.appendChild(b);
  });
  syncToolbar();
}
function syncToolbar(){
  document.querySelectorAll("#layoutGroup button").forEach(b=>b.classList.toggle("active",+b.dataset.layout===layoutIdx));
  updateBestDisplay();
}
function applyLang(){
  const t=I18N[lang];
  document.documentElement.lang=lang;
  document.getElementById("t-title").textContent=t.title;
  document.getElementById("btnNew").textContent=t.neu;
  document.getElementById("btnWinNew").textContent=t.neu;
  document.getElementById("btnUndo").textContent=t.undo;
  document.getElementById("btnHint").textContent=t.hint;
  document.getElementById("btnShuffle").textContent=t.shuffle;
  const bs=document.getElementById("btnSound"); bs.textContent=(soundOn?"🔊 ":"🔈 ")+t.sound; bs.classList.toggle("active",soundOn);
  document.getElementById("btnGuide").textContent=t.guideBtn;
  applyGuardLang();
  document.getElementById("t-layout").textContent=t.layout;
  document.getElementById("t-left").textContent=t.left;
  document.getElementById("t-time").textContent=t.time;
  document.getElementById("t-best").textContent=t.best;
  document.getElementById("btnResetBest").title=t.resetBestTitle;
  document.getElementById("t-win").textContent=t.win;
  document.getElementById("t-winsub").textContent=t.winsub;
  document.getElementById("t-gen").textContent=t.gen;
  const back=document.getElementById("t-back"); back.textContent=t.back; back.href=t.home;
  document.getElementById("t-platform").textContent=t.platform;
  document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("active",b.dataset.lang===lang));
  buildSelectors();
}

/* ============================ Verdrahtung ============================ */
document.getElementById("btnNew").addEventListener("click",()=>startNew(layoutIdx,themeIdx));
document.getElementById("btnWinNew").addEventListener("click",()=>{ hideWin(); startNew(layoutIdx,themeIdx); });
document.getElementById("btnUndo").addEventListener("click",undo);
document.getElementById("btnHint").addEventListener("click",hint);
document.getElementById("btnShuffle").addEventListener("click",()=>shuffleRemaining());
document.getElementById("btnSound").addEventListener("click",toggleSound);
document.getElementById("btnGuide").addEventListener("click",openGuide);
document.getElementById("btnGuideClose").addEventListener("click",closeGuide);
document.getElementById("btnResetBest").addEventListener("click",resetBest);
document.getElementById("btnSpeak").addEventListener("click",speakGuide);
document.getElementById("btnGuard").addEventListener("click",()=>{ if(guardOn) askGate(true,disableGuard); else enableGuard(); });
document.getElementById("btnSoftOk").addEventListener("click",()=>{ localStorage.setItem(SDK.SOFT,"1"); hideSoft(); });
document.getElementById("btnMedContinue").addEventListener("click",()=>askGate(false,()=>{ localStorage.setItem(SDK.MED,"1"); hideMedium(); if(started&&!solved) startTimer(); }));
document.getElementById("btnMedDisable").addEventListener("click",()=>askGate(true,()=>{ disableGuard(); hideMedium(); }));
document.getElementById("btnGateOk").addEventListener("click",gateSubmit);
document.getElementById("btnGateCancel").addEventListener("click",gateCancel);
document.getElementById("gateInput").addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); gateSubmit(); } });
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>{ lang=b.dataset.lang; localStorage.setItem("mjk_lang",lang); applyLang(); }));
let rT=null;
window.addEventListener("resize",()=>{ clearTimeout(rT); rT=setTimeout(()=>{ if(positions.length) layoutTiles(); },120); });
window.addEventListener("load",()=>{ if(positions.length) layoutTiles(); });

/* ============================ Start ============================ */
updateSpeakBtn();
applyLang();
if(load()){ syncToolbar(); if(started) startTimer(); }
else{ startNew(0,0); }
initGuard();
</script>
