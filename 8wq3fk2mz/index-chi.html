<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>讀者專頁 – Heribert Lange</title>
  <link rel="icon" type="image/x-icon" href="../favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Cinzel:wght@400;600&family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#393023; --text:#ede0c8; --text-muted:#a8987a; --accent:#d4b87a;
      --header-bg:#352918; --border:rgba(212,184,122,0.25); --card:#453217;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    body {
      font-family:'Cormorant Garamond','Noto Serif TC',Georgia,serif;
      background:var(--bg); color:var(--text); min-height:100vh; line-height:1.8;
    }
    body::before {
      content:''; position:fixed; inset:0;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events:none; z-index:0; opacity:0.4;
    }
    header {
      position:relative; z-index:10; background:var(--header-bg);
      border-bottom:1px solid var(--border); padding:48px 20px 32px; text-align:center;
    }
    .header-deco { display:flex; align-items:center; justify-content:center; gap:20px; margin-bottom:16px; }
    .header-deco-line { flex:1; max-width:120px; height:1px; background:linear-gradient(90deg,transparent,var(--accent)); }
    .header-deco-line.right { background:linear-gradient(90deg,var(--accent),transparent); }
    .header-deco-diamond { width:8px; height:8px; background:var(--accent); transform:rotate(45deg); }
    header h1 { font-family:'Cinzel',serif; font-size:2.6rem; font-weight:400; color:var(--accent); letter-spacing:6px; }
    header .subtitle { margin-top:10px; font-size:0.85rem; letter-spacing:6px; color:var(--text-muted); }
    .lang-switch { display:flex; justify-content:center; gap:10px; margin-top:24px; flex-wrap:wrap; }
    .lang-switch a, .lang-switch span {
      padding:6px 16px; border:1px solid var(--border); border-radius:20px;
      font-family:'Cinzel','Noto Serif TC',serif; font-size:0.74rem; letter-spacing:2px;
      text-decoration:none; color:var(--text-muted); transition:border-color .2s,color .2s;
    }
    .lang-switch a:hover { border-color:var(--accent); color:var(--accent); }
    .lang-switch .active { background:var(--accent); color:var(--header-bg); border-color:var(--accent); }
    .main { position:relative; z-index:1; padding:56px 24px 40px; max-width:760px; margin:0 auto; }
    .intro { text-align:center; color:var(--text-muted); font-size:1.05rem; margin-bottom:44px; line-height:1.9; }
    .letters { display:flex; flex-direction:column; gap:18px; }
    .letter-card {
      display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:20px;
      background:var(--card); border:1px solid var(--border); border-radius:10px;
      padding:24px 28px; text-decoration:none; color:var(--text);
      transition:border-color .2s, transform .2s;
    }
    .letter-card:hover { border-color:var(--accent); transform:translateY(-2px); }
    .letter-num { font-family:'Cinzel',serif; font-size:1.1rem; color:var(--accent); letter-spacing:2px; white-space:nowrap; }
    .letter-meta .letter-date { display:block; font-size:0.82rem; letter-spacing:2px; color:var(--text-muted); margin-bottom:4px; }
    .letter-meta .letter-name { font-size:1.25rem; color:var(--text); }
    .letter-arrow { color:var(--accent); font-size:1.4rem; }
    footer { position:relative; z-index:1; border-top:1px solid var(--border); padding:24px; text-align:center; margin-top:60px; }
    .footer-copy { font-size:0.78rem; color:var(--text-muted); letter-spacing:1px; opacity:0.6; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(24px);} to{opacity:1;transform:translateY(0);} }
    header { animation:fadeUp .6s ease both; }
    .letter-card { animation:fadeUp .5s ease both; }
    @media (max-width:600px){
      .letter-card { grid-template-columns:1fr; gap:8px; text-align:left; }
      .letter-arrow { display:none; }
    }
  </style>
</head>
<body>
<header>
  <div class="header-deco">
    <div class="header-deco-line"></div>
    <div class="header-deco-diamond"></div>
    <div class="header-deco-line right"></div>
  </div>
  <h1>Heribert Lange</h1>
  <p class="subtitle">讀者專頁</p>
  <div class="lang-switch">
    <a href="index.html">Deutsch</a>
    <a href="index-eng.html">English</a>
    <span class="active">繁體中文</span>
  </div>
</header>

<main class="main">
  <p class="intro">
    很高興您來到這裡。在這個頁面上，我收錄了所有寄給您的通訊，
    讓您能隨時從容回顧，不必再翻找信箱。
  </p>

  <div class="letters">
    <a class="letter-card" href="rundbrief-01-chi.html">
      <span class="letter-num">第 01 期</span>
      <span class="letter-meta">
        <span class="letter-date">2026 年 6 月 15 日</span>
        <span class="letter-name">2026 年 6 月的新消息</span>
      </span>
      <span class="letter-arrow">→</span>
    </a>
  </div>
</main>

<footer>
  <p class="footer-copy">© 2026 Heribert Lange · Berlin</p>
</footer>
</body>
</html>
